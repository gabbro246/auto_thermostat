name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python files
        run: python -m compileall -q custom_components/auto_thermostat tests
      - name: Run standalone unit and climate smoke tests
        run: python -m unittest discover -s tests -v
